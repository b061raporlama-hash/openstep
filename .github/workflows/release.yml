name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Expected a version tag such as v0.2.0."
          }
          [xml]$project = Get-Content src/OpenSteps.App/OpenSteps.App.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag must match the application version ($version)."
          }

      - name: Test on Windows
        run: dotnet test OpenSteps.sln --configuration Release --logger "trx;LogFileName=windows-tests.trx" --results-directory artifacts/test-results

      - name: Publish self-contained Windows x64 application
        run: dotnet publish src/OpenSteps.App/OpenSteps.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false --output artifacts/win-x64

      - name: Package application
        shell: pwsh
        run: |
          Copy-Item LICENSE artifacts/win-x64/LICENSE.txt
          Copy-Item README.md artifacts/win-x64/README.md
          $name = "OpenSteps-$env:RELEASE_TAG-win-x64.zip"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath "artifacts/$name"
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "artifacts/$name.sha256" -Encoding ascii

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: artifacts/test-results

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path $notes)) {
            throw "Missing release notes: $notes"
          }
          gh release create $env:RELEASE_TAG "artifacts/OpenSteps-$env:RELEASE_TAG-win-x64.zip" "artifacts/OpenSteps-$env:RELEASE_TAG-win-x64.zip.sha256" --verify-tag --title "OpenSteps $env:RELEASE_TAG" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
